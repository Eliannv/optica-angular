<nav class="navbar">
    <div class="navbar-container">
        <div class="navbar-left">
            <button class="menu-toggle" (click)="toggleSidebar()">
        <i class="menu-icon">☰</i>
      </button>
            <div class="navbar-brand">
                <span class="brand-text">Óptica Macias</span>
            </div>
            
            <!-- BUSCADOR GLOBAL -->
            <div class="search-container">
                <div class="search-input-wrapper">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"/>
                        <path d="m21 21-4.35-4.35"/>
                    </svg>
                    <input 
                        type="text" 
                        class="search-field" 
                        placeholder="Buscar sección..."
                        [(ngModel)]="terminoBusqueda"
                        (input)="buscarSecciones()"
                        (focus)="buscarSecciones()"
                        (keydown)="manejarTecla($event)"
                    />
                    <button 
                        type="button" 
                        class="search-clear" 
                        *ngIf="terminoBusqueda"
                        (click)="limpiarBusqueda()"
                        title="Limpiar"
                    >
                        ✕
                    </button>
                </div>

                <!-- SUGERENCIAS -->
                <div class="search-results" *ngIf="mostrarSugerencias && seccionesFiltradas.length > 0">
                    <div class="results-header">
                        <span class="results-count">{{ seccionesFiltradas.length }} resultado{{ seccionesFiltradas.length !== 1 ? 's' : '' }}</span>
                    </div>
                    <div class="results-items">
                        <button 
                            type="button"
                            class="result-item"
                            [class.selected]="i === indiceSugerenciaSeleccionada"
                            *ngFor="let seccion of seccionesFiltradas; let i = index"
                            (click)="navegarA(seccion)"
                            (mouseenter)="indiceSugerenciaSeleccionada = i"
                        >
                            <div class="result-content">
                                <div class="result-info">
                                    <span class="result-nombre">{{ seccion.nombre }}</span>
                                    <span class="result-categoria">{{ seccion.categoria }}</span>
                                </div>
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="m9 18 6-6-6-6"/>
                                </svg>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="navbar-right">
            <div class="navbar-actions">
                <!-- SELECTOR DE SUCURSAL -->
                <app-selector-sucursal></app-selector-sucursal>

                <div class="navbar-divider"></div>
                
                <button class="navbar-btn" title="Cambiar tema" (click)="toggleTheme()">
  <span class="icon">
    <!-- Sol -->
    <svg *ngIf="themeService.isDark()"
      xmlns="http://www.w3.org/2000/svg"
      width="24" height="24" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="lucide lucide-sun">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m4.93 19.07 1.41-1.41"/>
      <path d="m17.66 6.34 1.41-1.41"/>
    </svg>

    <!-- Luna -->
    <svg *ngIf="!themeService.isDark()"
      xmlns="http://www.w3.org/2000/svg"
      width="24" height="24" viewBox="0 0 24 24"
      fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="lucide lucide-moon">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>
    </svg>
  </span>
</button>

                <div class="user-menu">
                    <button class="user-btn">
            <span class="user-avatar"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-icon lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="user-name">{{ userName }}</span>
            <span class="user-role" style="font-size: 0.75rem; opacity: 0.7; display: block;">{{ userRole }}</span>
          </button>
                </div>
            </div>
        </div>
    </div>
</nav>
